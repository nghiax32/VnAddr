[project]
name = "vn-addr"
version = "0.0.0"
description = "Convert Vietnamese addresses from the pre-2025 administrative system to the 2025 system, with mappings traced to the legal documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3"]

[project.optional-dependencies]
polars = ["polars>=1"]
pandas = ["pandas>=2"]
duckdb = ["duckdb>=1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-benchmark>=4",
]
pipeline = [
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vn_addr"]

[tool.uv]
default-groups = ["dev", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the pipeline package, which is not installed
markers = [
    "reference: expected results taken from another library, not yet verified against the legal documents",
]
