default-groups = ["dev", "pipeline"]
dependencies = [
    { name = "rapidfuzz", version = "3.14.5", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "rapidfuzz", version = "3.14.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
]

[package.optional-dependencies]
duckdb = [
    { name = "duckdb", version = "1.5.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "duckdb", version = "2.0.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
]
pandas = [
    { name = "pandas", version = "2.3.3", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "pandas", version = "3.1.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
]
polars = [
    { name = "polars", version = "2.0.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "polars", version = "2.2.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
]

[package.dev-dependencies]
dev = [
    { name = "hypothesis", version = "6.168.5", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "hypothesis", version = "6.170.17", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-benchmark" },
    { name = "ruff" },
    { name = "vietnamadminunits" },
]
pipeline = [
    { name = "beautifulsoup4" },
    { name = "httpx" },
    { name = "numpy", version = "2.2.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "numpy", version = "2.4.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version == '3.11.*'" },
    { name = "numpy", version = "2.5.5", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.12'" },
    { name = "openpyxl" },
    { name = "pdfplumber", version = "0.11.10", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "pdfplumber", version = "0.11.11", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "pillow", version = "12.3.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "pillow", version = "13.0.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
]

[package.metadata]
requires-dist = [
    { name = "duckdb", marker = "extra == 'duckdb'", specifier = ">=1" },
    { name = "pandas", marker = "extra == 'pandas'", specifier = ">=2" },
    { name = "polars", marker = "extra == 'polars'", specifier = ">=1" },
    { name = "rapidfuzz", specifier = ">=3" },
]
provides-extras = ["polars", "pandas", "duckdb"]

[package.metadata.requires-dev]
dev = [
    { name = "hypothesis", specifier = ">=6" },
    { name = "mypy", specifier = ">=1.11" },
    { name = "pytest", specifier = ">=8" },
    { name = "pytest-benchmark", specifier = ">=4" },
    { name = "ruff", specifier = ">=0.6" },
    { name = "vietnamadminunits", specifier = ">=1.0.4" },
]
pipeline = [
    { name = "beautifulsoup4", specifier = ">=4.12" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "numpy", specifier = ">=2.2.6" },
    { name = "openpyxl", specifier = ">=3.1.5" },
    { name = "pdfplumber", specifier = ">=0.11" },
    { name = "pillow", specifier = ">=12.3.0" },
]
